# Alembic configuration for the Argi backend.
#
# The database URL is NOT hard-coded here: migrations/env.py imports
# `app.config.settings` and uses `settings.DATABASE_URL` at runtime, so the
# same config works locally and inside the container without edits.

[alembic]
# Path (relative to this file) to the migration environment.
script_location = migrations

# Template used by `alembic revision`.
# file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Timezone for timestamps in generated revisions (UTC keeps them stable).
timezone = UTC

prepend_sys_path = .

# sqlalchemy.url is intentionally left blank; env.py sets it from settings.
sqlalchemy.url =


[post_write_hooks]
# (none)


# ---- Logging ----------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
