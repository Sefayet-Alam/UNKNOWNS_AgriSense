[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra
markers =
    unit: fast, pure-Python unit tests (no DB, no network)
    integration: tests that hit the app + test database
    streaming: SSE streaming / agentic tests
filterwarnings =
    ignore::DeprecationWarning
