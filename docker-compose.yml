services:
  db:
    image: pgvector/pgvector:pg16
    container_name: argi_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-argi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-argi_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-argi}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-argi} -d ${POSTGRES_DB:-argi}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: argi_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-argi}:${POSTGRES_PASSWORD:-argi_dev_password}@db:5432/${POSTGRES_DB:-argi}
    ports:
      - "8080:8000"
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: argi_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
