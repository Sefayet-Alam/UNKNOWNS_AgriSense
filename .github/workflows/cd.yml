name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy AgriSense
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$VPS_HOST"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Pull and deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          test -n "$VPS_USER"
          test -n "$VPS_DEPLOY_PATH"
          ssh -o ServerAliveInterval=20 -o ServerAliveCountMax=3 \
            "$VPS_USER@$VPS_HOST" "bash -s -- '$VPS_DEPLOY_PATH'" <<'DEPLOY'
              set -euo pipefail

              cd "$1"
              test -f .env

              git fetch origin main
              git switch main
              git pull --ff-only origin main
              test -f docker-compose.prod.yml

              export NEXT_PUBLIC_API_URL=https://agrisense.cortextech.dev
              COMPOSE="docker compose -p agrisense-prod -f docker-compose.prod.yml"
              $COMPOSE up -d --build --remove-orphans
              $COMPOSE ps

              for attempt in 1 2 3 4 5; do
                if curl -fsS --max-time 10 http://127.0.0.1:18743/health >/dev/null; then
                  break
                fi
                if [ "$attempt" -eq 5 ]; then
                  echo "Backend health check failed" >&2
                  exit 1
                fi
                sleep 5
              done

              for attempt in 1 2 3 4 5; do
                if curl -fsS --max-time 10 http://127.0.0.1:19327/ >/dev/null; then
                  break
                fi
                if [ "$attempt" -eq 5 ]; then
                  echo "Frontend health check failed" >&2
                  exit 1
                fi
                sleep 5
              done
          DEPLOY
